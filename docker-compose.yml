# ATLAS B3 — ambiente local. Nenhum serviço executa ordens.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas}"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atlas}
      ATLAS_CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data/store
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata:
  backend_data:
