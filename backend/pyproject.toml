[project]
name = "atlas-b3"
version = "0.1.0"
description = "ATLAS B3 — pesquisa, monitoramento e simulação para WIN/WDO (5 min). Não executa ordens."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
